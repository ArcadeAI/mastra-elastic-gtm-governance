# Workshop services on Render. This file does not deploy anything by itself.
# Apply it manually only after reviewing the configured services and costs.
# One worker per persistent disk; redeploying preserves state. Use workshop reset.
# Only the Python Sales toolkit is deployed in Arcade. Web/hooks own approvals.
# Public hostnames come from RENDER_EXTERNAL_HOSTNAME, not the private host property.
# New sync:false values on existing services must be set manually in the dashboard.
# Copy the cg-idp workshop-web client credentials into cg-web after initial boot.

services:
- type: web
  name: cg-lead-app
  runtime: docker
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  dockerfilePath: ./apps/lead-app/Dockerfile
  dockerContext: .
  healthCheckPath: /health
  autoDeployTrigger: 'off'
  disk:
    name: leads
    mountPath: /data
    sizeGB: 1
  envVars:
  - key: PORT
    value: 8080
  - key: LEADS_DB_PATH
    value: /data/renewal.db
  - key: LEAD_INTERNAL_TOKEN
    generateValue: true
  - key: IDP_PUBLIC_HOST
    fromService:
      name: cg-idp
      type: web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
- type: web
  name: cg-hooks
  runtime: docker
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  dockerfilePath: ./apps/hooks/Dockerfile
  dockerContext: .
  healthCheckPath: /health
  autoDeployTrigger: 'off'
  disk:
    name: governance
    mountPath: /data
    sizeGB: 1
  envVars:
  - key: PORT
    value: 8080
  - key: GOVERNANCE_DB_PATH
    value: /data/governance-renewal.db
  - key: ARCADE_HOOK_SECRET
    generateValue: true
  - key: APPROVALS_SERVICE_TOKEN
    generateValue: true
  - key: WEB_SERVICE_TOKEN
    generateValue: true
  - key: WORKSHOP_OPERATOR_TOKEN
    generateValue: true
  - key: LEAD_INTERNAL_TOKEN
    fromService:
      name: cg-lead-app
      type: web
      envVarKey: LEAD_INTERNAL_TOKEN
  - key: LEAD_APP_PUBLIC_HOST
    fromService:
      name: cg-lead-app
      type: web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: IDP_PUBLIC_HOST
    fromService:
      name: cg-idp
      type: web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: WEB_PUBLIC_HOST
    fromService:
      name: cg-web
      type: web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: PERSONA_DANA_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_DANA_EMAIL
  - key: PERSONA_SAM_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_SAM_EMAIL
  - key: PERSONA_RILEY_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_RILEY_EMAIL
  - key: PERSONA_MORGAN_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_MORGAN_EMAIL
  - key: WORKSHOP_VERIFICATION_USER_ID
    value: verification@example.test
  - key: WORKSHOP_SOLO_SLACK
    value: 'true'
  - key: WORKSHOP_SLACK_TEAM_ID
    sync: false
  - key: ARCADE_SALES_TOOLKIT
    value: Sales
  - key: ARCADE_ELASTIC_HOOK_TOOLS
    sync: false
  - key: ARCADE_DISCOUNT_TOOL_NAME
    fromService:
      name: cg-web
      type: web
      envVarKey: ARCADE_DISCOUNT_TOOL_NAME
- type: web
  name: cg-idp
  runtime: docker
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  dockerfilePath: ./apps/idp/Dockerfile
  dockerContext: .
  healthCheckPath: /health
  autoDeployTrigger: 'off'
  disk:
    name: identity
    mountPath: /data
    sizeGB: 1
  envVars:
  - key: PORT
    value: 8080
  - key: IDP_DB_PATH
    value: /data/idp.db
  - key: BETTER_AUTH_SECRET
    generateValue: true
  - key: WORKSHOP_OPERATOR_TOKEN
    fromService:
      name: cg-hooks
      type: web
      envVarKey: WORKSHOP_OPERATOR_TOKEN
  - key: IDP_OAUTH_REDIRECT_URIS
    value: https://cloud.arcade.dev/api/v1/oauth/callback
  - key: WORKSHOP_WEB_REDIRECT_URI
    sync: false
  - key: PERSONA_DANA_EMAIL
    sync: false
  - key: PERSONA_SAM_EMAIL
    value: sam@example.test
  - key: PERSONA_RILEY_EMAIL
    value: riley@example.test
  - key: PERSONA_MORGAN_EMAIL
    value: morgan@example.test
  - key: WORKSHOP_VERIFICATION_USER_ID
    value: verification@example.test
- type: web
  name: cg-web
  runtime: docker
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  dockerfilePath: ./apps/web/Dockerfile
  dockerContext: .
  healthCheckPath: /health
  autoDeployTrigger: 'off'
  disk:
    name: agent-snapshots
    mountPath: /data
    sizeGB: 1
  envVars:
  - key: PORT
    value: 8080
  - key: MASTRA_DB_URL
    value: file:/data/mastra-renewal.db
  - key: MODEL_ID
    value: anthropic/claude-sonnet-4-6
  - key: ANTHROPIC_API_KEY
    sync: false
  - key: ARCADE_API_KEY
    sync: false
  - key: ARCADE_GATEWAY_ID
    sync: false
  - key: ARCADE_ELASTIC_TOOL_NAMES
    sync: false
  - key: ARCADE_DISCOUNT_TOOL_NAME
    sync: false
  - key: ARCADE_GET_OFFER_TOOL_NAME
    sync: false
  - key: PERSONA_DANA_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_DANA_EMAIL
  - key: PERSONA_SAM_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_SAM_EMAIL
  - key: PERSONA_RILEY_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_RILEY_EMAIL
  - key: PERSONA_MORGAN_EMAIL
    fromService:
      name: cg-idp
      type: web
      envVarKey: PERSONA_MORGAN_EMAIL
  - key: HOOKS_PUBLIC_HOST
    fromService:
      name: cg-hooks
      type: web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: IDP_PUBLIC_HOST
    fromService:
      name: cg-idp
      type: web
      envVarKey: RENDER_EXTERNAL_HOSTNAME
  - key: WEB_PUBLIC_ORIGIN
    fromService:
      name: cg-web
      type: web
      envVarKey: RENDER_EXTERNAL_URL
  - key: WEB_SERVICE_TOKEN
    fromService:
      name: cg-hooks
      type: web
      envVarKey: WEB_SERVICE_TOKEN
  - key: APPROVALS_SERVICE_TOKEN
    fromService:
      name: cg-hooks
      type: web
      envVarKey: APPROVALS_SERVICE_TOKEN
  - key: WORKSHOP_VERIFICATION_USER_ID
    value: verification@example.test
  - key: WORKSHOP_OPERATOR_TOKEN
    fromService:
      name: cg-hooks
      type: web
      envVarKey: WORKSHOP_OPERATOR_TOKEN
  - key: WEB_SESSION_SECRET
    generateValue: true
  - key: WEB_OAUTH_CLIENT_ID
    sync: false
  - key: WEB_OAUTH_CLIENT_SECRET
    sync: false
  - key: WORKSHOP_DEMO_MODE
    value: 'true'
