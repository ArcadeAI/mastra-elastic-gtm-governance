[project]
name = "lead"
version = "1.0.0"
description = "Four stateless Sales tools for accounts, discounted yearly offers, and local activation-email drafts."
requires-python = ">=3.11"
dependencies = [
    "arcade-mcp-server>=1.28.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "arcade-mcp[all]>=1.15.0,<2.0.0",
    "mypy>=1.18.0,<2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.13.0,<1.0.0",
]

# Tells Arcade this package carries Arcade tools.
[project.entry-points.arcade_toolkits]
toolkit_name = "lead"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lead"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["lead/**/*.py"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_return_any = true
warn_unused_ignores = true
